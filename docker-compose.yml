services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg15
    container_name: lms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_password}
      POSTGRES_DB: ${DB_NAME:-lms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms_user} -d ${DB_NAME:-lms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: lms_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-lms_user}:${DB_PASSWORD:-lms_password}@db:5432/${DB_NAME:-lms_db}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - STORAGE_PATH=/app/storage
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GOOGLE_AI_ENDPOINT=${GOOGLE_AI_ENDPOINT}
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-512}
      - LLM_THINKING_LEVEL=${LLM_THINKING_LEVEL}
    volumes:
      - ./apps/backend/app:/app/app
      - storage_data:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lms_network

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local

networks:
  lms_network:
    driver: bridge
