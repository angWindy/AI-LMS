services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg15
    container_name: lms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_password}
      POSTGRES_DB: ${DB_NAME:-lms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms_user} -d ${DB_NAME:-lms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: lms_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-lms_user}:${DB_PASSWORD:-lms_password}@db:5432/${DB_NAME:-lms_db}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://nginx
      - STORAGE_PATH=/app/storage
      - MAX_DOCUMENT_SIZE_MB=${MAX_DOCUMENT_SIZE_MB:-100}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GOOGLE_AI_ENDPOINT=${GOOGLE_AI_ENDPOINT}
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite-preview}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-512}
      - LLM_THINKING_LEVEL=${LLM_THINKING_LEVEL}
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lms_network

  # Next.js Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
    container_name: lms_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend
    networks:
      - lms_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lms_network

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local

networks:
  lms_network:
    driver: bridge
